<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Конструктор приглашений — Beauty Games</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Montserrat:wght@700;800&display=swap">
<style>
  :root{--ink:#07060b;--m:#E6007E;--g:#f2dcae;--line:rgba(255,255,255,.12);--mut:#A29BB2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:#EDEAF3;font:16px/1.55 Manrope,system-ui,sans-serif;padding:32px 16px 64px}
  .w{width:min(640px,100%);margin:0 auto}
  h1{font:800 26px/1.2 Montserrat,sans-serif;margin:0 0 6px}
  .sub{color:var(--mut);margin:0 0 28px;font-size:14.5px}
  label{display:block;margin:0 0 6px;font:700 11px/1.3 Montserrat,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
  .f{margin-bottom:18px}
  input,textarea,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#120f18;color:#fff;font:500 16px/1.4 Manrope,sans-serif}
  textarea{min-height:90px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--m)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{margin-top:6px;font-size:13px;color:var(--mut)}
  .out{margin-top:26px;padding:18px;border-radius:14px;border:1px solid rgba(230,0,126,.4);background:rgba(230,0,126,.07)}
  .link{word-break:break-all;font-size:13.5px;color:var(--g);margin:6px 0 14px}
  .btns{display:flex;flex-wrap:wrap;gap:10px}
  button,.b{padding:12px 18px;border-radius:99px;border:0;cursor:pointer;font:800 11.5px/1 Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--m);text-decoration:none}
  .b2{background:transparent;border:1px solid var(--line);color:#fff}
  .ok{color:#9BE800;font-size:13px;margin-left:6px}
  .msg{margin-top:18px}
  .msg textarea{min-height:170px;font-size:14.5px}
  @media (max-width:560px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w">
  <h1>Персональное приглашение</h1>
  <p class="sub">Заполните поля — получится личная ссылка-конверт для одного человека. Данные живут только в ссылке и нигде не сохраняются.</p>

  <div class="row">
    <div class="f"><label for="n">Имя (как на конверте)</label><input id="n" placeholder="Анна"></div>
    <div class="f"><label for="g">Обращение</label>
      <select id="g"><option>Дорогая</option><option>Дорогой</option><option>Уважаемая</option><option>Уважаемый</option><option>Милая</option></select></div>
  </div>
  <div class="row">
    <div class="f"><label for="t">На «вы» или на «ты»</label>
      <select id="t"><option value="0">На «вы»</option><option value="1">На «ты»</option></select></div>
    <div class="f"><label for="d">Ответ ждём до (необязательно)</label><input id="d" placeholder="15 ноября"></div>
  </div>
  <div class="f"><label for="p">Личные слова Ирины</label>
    <textarea id="p" placeholder="Я давно смотрю, как растут ваши ученицы, и каждый раз думаю: вот кого я хочу видеть рядом на сцене финала."></textarea>
    <div class="hint">1–2 предложения именно про этого человека. Это главное, что делает приглашение личным.</div></div>
  <div class="f"><label for="team">Название команды (необязательно)</label><input id="team" placeholder="Если пусто — в центре будет имя и «Капитан»"></div>

  <div class="out">
    <label>Ссылка-приглашение</label>
    <div class="link" id="link">—</div>
    <div class="btns">
      <button id="copy">Копировать ссылку</button>
      <a class="b b2" id="open" target="_blank" rel="noopener">Открыть</a>
      <a class="b b2" id="pdf" target="_blank" rel="noopener">Сохранить PDF</a>
      <span class="ok" id="ok"></span>
    </div>
    <div class="msg">
      <label for="msg">Сообщение, с которым отправить ссылку</label>
      <textarea id="msg"></textarea>
      <div class="btns" style="margin-top:10px"><button id="copyMsg">Копировать сообщение</button><span class="ok" id="ok2"></span></div>
    </div>
  </div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var base=location.origin+location.pathname.replace(/invite-make(\.html)?$/,'invite');
  if(/^file:/.test(location.protocol)) base=location.href.replace(/invite-make\.html.*$/,'invite.html');
  function enc(o){
    var b=new TextEncoder().encode(JSON.stringify(o)),s='';
    for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function upd(){
    var o={n:$('n').value.trim(),g:$('g').value};
    if($('t').value==='1')o.t=1;
    ['p','d','team'].forEach(function(k){var v=$(k).value.trim();if(v)o[k]=v});
    var h='#i='+enc(o),url=base+h;
    $('link').textContent=url;$('open').href=url;
    $('pdf').href=base+(base.indexOf('?')>-1?'&':'?')+'print'+h;
    var ty=o.t===1,nm=o.n||'';
    $('msg').value=(nm?nm+', ':'')+(ty?'привет! ':'здравствуйте! ')+'Это Ирина Вербовая.\n\n'+
      (ty?'У меня для тебя кое-что личное — приглашение, которое я отправляю только нескольким людям. Открой, когда будет пара спокойных минут 💌':
          'У меня для вас кое-что личное — приглашение, которое я отправляю только нескольким людям. Откройте, когда будет пара спокойных минут 💌')+
      '\n\n'+url;
  }
  ['n','g','t','p','d','team'].forEach(function(id){$(id).addEventListener('input',upd)});
  function cp(txt,el){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){el.textContent='Скопировано'},function(){el.textContent='Выделите и скопируйте вручную'});setTimeout(function(){el.textContent=''},2200)}
  $('copy').onclick=function(){cp($('link').textContent,$('ok'))};
  $('copyMsg').onclick=function(){cp($('msg').value,$('ok2'))};
  upd();
})();
</script>
</body>
</html>
